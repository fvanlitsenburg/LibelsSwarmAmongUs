[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "historical-text-pipeline"
version = "0.1.0"
description = "A multi-source pipeline for relevance assessment and analysis of historical texts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "sqlalchemy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.hatch.build.targets.wheel]
packages = ["src/historical_text_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"