[project]
name = "historical-text-pipeline"
version = "0.1.0"
description = "A multi-source pipeline for relevance assessment and analysis of historical texts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "SQLAlchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "alembic>=1,<2"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]